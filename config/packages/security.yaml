security:
    providers:
        sialeg_users:
            id: App\Security\UsuarioProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: sialeg_users
            custom_authenticators:
                - App\Security\UniversidadAuthenticator
            logout:
                path: /api/auth/logout

    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
